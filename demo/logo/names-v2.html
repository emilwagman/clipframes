<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#f7f5f0;color:#141414;font:500 15px -apple-system,system-ui}
.n{display:grid;grid-template-columns:220px 220px 240px 1fr;align-items:center;gap:40px;padding:46px 56px;border-bottom:1px solid #e4e0d8}
.n.dark{background:#111;color:#f3f1ec;border-color:#222}
h2{margin:0;font-size:26px;letter-spacing:-.02em}
small{display:block;color:#8d877d;margin-top:6px;line-height:1.4}
.tile{width:180px;height:180px;border-radius:41px;background:#fbfaf7;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 18px 40px -20px rgba(0,0,0,.35);display:grid;place-items:center}
.tile img{width:52%;height:52%;object-fit:contain}
.tile.ink{background:#141414;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 18px 40px -20px rgba(0,0,0,.5)}
.tile.ink img{filter:invert(1)}
.pair{display:flex;gap:22px;align-items:center}
.pair .tile{width:96px;height:96px;border-radius:22px}
.pair .tile.s{width:40px;height:40px;border-radius:9px}
.lock{display:flex;align-items:center;gap:16px}
.lock img{height:46px;object-fit:contain}
.dark .lock img{filter:invert(1)}
.lock .w{font-size:42px;letter-spacing:-.02em;line-height:1}
.serif{font-family:"New York","Iowan Old Style",Georgia,serif;font-weight:500}
.sans{font-family:-apple-system,system-ui;font-weight:650}
</style><body>
