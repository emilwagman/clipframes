<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#f7f5f0;color:#141414;font:500 15px -apple-system,system-ui}
.n{display:grid;grid-template-columns:220px 260px 220px 1fr;align-items:center;gap:30px;padding:46px 56px;border-bottom:1px solid #e4e0d8}
.n.dark{background:#111;color:#f3f1ec;border-color:#222}
h2{margin:0;font-size:26px;letter-spacing:-.02em}
small{display:block;color:#8d877d;margin-top:6px;line-height:1.4}
.tile{width:200px;height:200px;border-radius:46px;background:#fbfaf7;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 18px 40px -20px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden}
.tile img{width:330px;height:330px;mix-blend-mode:multiply}
.dark .tile{background:#fbfaf7}
.bare img{width:220px;height:220px;mix-blend-mode:multiply}
.dark .bare img{mix-blend-mode:screen;filter:invert(1)}
.lock{display:flex;align-items:center;gap:6px}
.lock img{width:72px;height:72px;margin:-14px;mix-blend-mode:multiply}
.dark .lock img{mix-blend-mode:screen;filter:invert(1)}
.lock .w{font-size:40px;letter-spacing:-.02em;margin-left:12px}
.serif{font-family:"New York","Iowan Old Style",Georgia,serif;font-weight:500}
.sans{font-family:-apple-system,system-ui;font-weight:650}
</style><body>
