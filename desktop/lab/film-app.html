<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoices · Northwind</title>
<!-- The page the launch film points at: lab/northwind.html reduced to grey blocks, with the
     heading and three real things left in. The ids and classes are the ones the copied text names. -->
<style>
  :root { --ink: #17181c; --ink-3: #9a9ea8; --line: #e8e9ee; --bg: #f7f8fa; --block: #e9ebef; --brand: #3b3fd8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 132px 1fr; height: 100%; }
  aside { background: var(--bg); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  main { padding: 14px 24px; }
  /* A grey block standing in for content that is not the subject. */
  .b { display: block; height: 10px; border-radius: 5px; background: var(--block); }
  aside .b:first-child { width: 72px; height: 14px; margin-bottom: 10px; background: #dfe1e7; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 19px; line-height: 24px; font-weight: 650; letter-spacing: -0.01em; }
  button { font: inherit; font-weight: 550; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  button.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; height: 56px; }
  .stat .b { width: 64px; height: 8px; }
  .stat .b + .b { width: 88px; height: 16px; margin-top: 10px; border-radius: 6px; }
  .stat strong { display: block; font-size: 20px; line-height: 24px; font-weight: 650; margin-top: 6px; }
  .stat.overdue strong { color: #d6333a; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th { padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  th .b { width: 48px; height: 8px; }
  td { height: 36px; padding: 0 10px; border-bottom: 1px solid #f1f2f5; }
  td.amount, th.amount { text-align: right; font-variant-numeric: tabular-nums; }
  th.amount .b { margin-left: auto; }
  td .b { width: 70%; }
  /* Only things can be pointed at, not the layout that holds them: the pointer crosses a lot of
     empty page on its way, and an outline around half the window each time hides the subject. */
  .app, aside, main, .top, .stats, table, thead, tbody, tr { pointer-events: none; }
  .b, h1, button, .stat, td, th { pointer-events: auto; }
  .badge { font-size: 11.5px; font-weight: 550; padding: 2px 8px; border-radius: 999px; }
  .badge.paid { background: #e3f6ea; color: #17803d; }
  .badge.due { background: #fff4d6; color: #9a6b00; }
  .badge.overdue { background: #fde6e7; color: #c42a31; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <i class="b"></i><i class="b" style="width: 84px"></i><i class="b" style="width: 64px"></i><i class="b" style="width: 92px"></i><i class="b" style="width: 56px"></i><i class="b" style="width: 76px"></i>
  </aside>
  <main>
    <div class="top">
      <h1>Invoices</h1>
      <button id="new-invoice" class="btn btn-primary">New invoice</button>
    </div>
    <div class="stats">
      <div class="stat" id="paid-total"><i class="b"></i><i class="b"></i></div>
      <div class="stat" id="outstanding-total"><i class="b"></i><i class="b"></i></div>
      <div class="stat overdue" id="overdue-total"><i class="b"></i><strong>$3,120</strong></div>
    </div>
    <table id="invoice-table">
      <thead><tr><th><i class="b"></i></th><th><i class="b"></i></th><th><i class="b"></i></th><th class="amount"><i class="b"></i></th></tr></thead>
      <tbody>
        <tr><td>INV-1042</td><td>Harbor Supply</td><td><span class="badge overdue">Overdue</span></td><td class="amount">$3,120.00</td></tr>
        <tr><td>INV-1041</td><td>Alder Studio</td><td><span class="badge due">Due</span></td><td class="amount">$8,400.00</td></tr>
        <tr><td>INV-1040</td><td>Lindqvist &amp; Co</td><td><span class="badge paid">Paid</span></td><td class="amount">$1,950.00</td></tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
