[package]
name = "clipframes"
version = "0.3.0"
description = "Point at the thing you want changed, and Clipframes tells your agent what it is."
authors = ["Emil Wagman"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipframes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the element under the pointer is different on every system (src/element/).
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"

[[bin]]
name = "clipframes"
path = "src/main.rs"

# Prints the element under the pointer once a second: the quickest check on a new machine.
[[bin]]
name = "cf-probe"
path = "src/bin/probe.rs"

# Times element readings across the screen: the number behind "the highlight never lags".
[[bin]]
name = "cf-bench"
path = "src/bin/bench.rs"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # small first: this app stays tiny
panic = "abort"
strip = true
