<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clipframes in the browser</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #glass { position: absolute; inset: 0; }
  #open { position: absolute; right: 16px; top: 16px; z-index: 2; font: 600 13px system-ui; padding: 8px 14px; border-radius: 16px; border: 0; background: #121213; color: #fff; }
  #copied { position: absolute; left: 16px; bottom: 16px; z-index: 2; max-width: 60ch; margin: 0; padding: 10px 12px; border-radius: 10px; background: #121213; color: #fff; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
</style>
<script type="module" src="/lab/demo.tsx"></script>
</head>
<body><iframe id="page" src="/lab/northwind.html"></iframe><div id="glass"></div><button id="open">Open Clipframes</button><pre id="copied" hidden></pre></body>
</html>
