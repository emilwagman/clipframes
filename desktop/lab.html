<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clipframes UI lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  #overlay, #bar, #note { position: absolute; }
  #overlay { overflow: hidden; }
  #history { position: absolute; left: 50%; top: 70px; width: 680px; height: 430px; margin-left: -340px; border-radius: 12px; overflow: hidden; background: #0b0b0c; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.35); }
  #history .history { height: 100%; }
  #overlay { inset: 0; }
</style>
<script type="module" src="/lab/lab.tsx"></script>
</head>
<body><iframe id="page" src="/lab/northwind.html"></iframe><div id="overlay"></div><div id="bar"></div><div id="note"></div><div id="history" hidden></div></body>
</html>
