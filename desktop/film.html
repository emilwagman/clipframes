<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clipframes launch film</title>
<!-- The launch film: the real bar, comment box and overlay (ui/) over a simplified page, driven by
     a scripted pointer. lab/film.tsx holds the timeline; tools/film-render.mjs renders it frame by
     frame. Opened in a browser it plays by itself. ?window=browser gives the page a browser frame. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  html body { background: #eef0f3; }
  /* The picture: 1920 by 1080, scaled to fit when the film is only being watched. */
  #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #eef0f3; }
  /* Everything that exists: a screen (the glass) with one app window on it, and a terminal to
     its right. The camera is a transform on this. */
  #world { position: absolute; left: 0; top: 0; width: 1792px; height: 576px; transform-origin: 0 0; }
  #glass { position: absolute; left: 0; top: 0; width: 1024px; height: 576px; }

  .win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(17, 18, 20, 0.08), 0 18px 44px -12px rgba(17, 18, 20, 0.22), 0 4px 10px rgba(17, 18, 20, 0.05); }
  #app { left: 132px; top: 20px; width: 760px; height: 432px; background: #fff; }
  #app .chrome { position: relative; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 11px; background: #f6f7f9; border-bottom: 1px solid #e8e9ee; font: 500 11.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #6c707a; -webkit-font-smoothing: antialiased; }
  .chrome i { width: 9px; height: 9px; border-radius: 50%; background: #d9dbe1; flex: none; }
  .chrome .title { position: absolute; left: 0; right: 0; text-align: center; }
  .chrome .address { display: none; }
  /* The same window as a browser: the title gives way to an address. */
  [data-window="browser"] .chrome .title { display: none; }
  [data-window="browser"] .chrome .address { display: block; position: absolute; left: 50%; top: 5px; width: 300px; margin-left: -150px; height: 18px; border-radius: 9px; background: #e9ebef; text-align: center; line-height: 18px; font-size: 11px; color: #4d515a; }
  #app iframe { display: block; width: 760px; height: 404px; border: 0; }

  #term { left: 1080px; top: 128px; width: 668px; height: 320px; background: #161618; color: #e9e9ec; font: 20px/30px ui-monospace, "SF Mono", Menlo, monospace; -webkit-font-smoothing: antialiased; }
  #term .chrome { position: relative; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #1f1f22; font: 500 11.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #85868e; }
  #term .chrome i { background: #3a3a3f; }
  #term .body { padding: 20px 24px; }
  #term .dim { color: #7c7d86; }
  #term .head { font-size: 15px; line-height: 22px; }
  #term .head b { font-weight: 600; color: #e9e9ec; }
  #term .prompt { display: flex; gap: 12px; margin-top: 18px; padding: 12px 16px; border: 1px solid #3d3d43; border-radius: 10px; }
  #term .prompt .text { flex: 1; min-width: 0; min-height: 30px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #term .cursor { display: inline-block; width: 11px; height: 23px; margin-bottom: -4px; background: #e9e9ec; }
  #term .hint { margin: 10px 2px 0; font-size: 14px; line-height: 20px; }

  /* The pointer is drawn; the real one is never in the picture. */
  #pointer { position: absolute; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; transform-origin: 3px 2px; filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.32)); z-index: 5; }
  /* The caret in the comment box, drawn by the film so that it does not blink out of step. */
  #caret { position: absolute; left: 0; top: 0; width: 1.5px; height: 18px; background: #ff9550; pointer-events: none; z-index: 4; }

  /* The one thing the film adds to the interface itself: the bar rises into place. */
  #glass .window:has(> .bar) { opacity: var(--bar-in, 1); transform: translateY(var(--bar-y, 0px)); }
  #glass .clipframes-web { cursor: none; }
  #glass textarea { caret-color: transparent; }
  /* A scripted pointer cannot hover; this is button.round:hover from ui/style.css. */
  #glass button.round[data-hover]:not(.on) { background: var(--raised); color: var(--text); }
</style>
<script type="module" src="/lab/film.tsx"></script>
</head>
<body>
<div id="frame">
  <div id="world">
    <div id="app" class="win">
      <div class="chrome"><i></i><i></i><i></i><span class="title">Northwind</span><span class="address">localhost:3000</span></div>
      <iframe id="page" src="/lab/film-app.html" tabindex="-1"></iframe>
    </div>
    <div id="term" class="win">
      <div class="chrome"><i></i><i></i><i></i><span class="title">northwind</span></div>
      <div class="body">
        <div class="head"><b>Claude Code</b><br><span class="dim">~/northwind</span></div>
        <div class="prompt"><span class="dim">&gt;</span><span class="text"><span id="pasted"></span><span class="cursor" id="cursor" hidden></span></span></div>
        <div class="hint dim">? for shortcuts</div>
      </div>
    </div>
    <div id="glass"></div>
    <div id="caret" hidden></div>
    <svg id="pointer" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 2v18.2l4.7-4.3 3.1 7.2 3.2-1.4-3.1-7.1h6.5z" fill="#111214" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
</div>
</body>
</html>
